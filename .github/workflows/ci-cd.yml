name: RAGTUNE Enterprise CI/CD Production Pipeline

on:
  push:
    branches: [ main, staging, dev ]
  pull_request:
    branches: [ main, staging ]

permissions:
  contents: read
  packages: write
  security-events: write

jobs:
  # ---------------------------------------------------------------------------
  # Stage 1: Quality Assurance, Code Linting & Type Checking
  # ---------------------------------------------------------------------------
  lint-and-validate:
    name: Lint, Format & Type Checking
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff black mypy pytest -r requirements.txt

      - name: Code Formatting Check (Black)
        run: black --check .

      - name: Fast Linting Check (Ruff)
        run: ruff check .

      - name: Static Type Checking (Mypy)
        run: mypy api/ config/ guardrails/ agents/ --ignore-missing-imports

  # ---------------------------------------------------------------------------
  # Stage 2: Security & Vulnerability Scanning
  # ---------------------------------------------------------------------------
  security-scan:
    name: Security & Secret Vulnerability Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Run Bandit AST Security Scan (fail only on HIGH)
        run: |
          python -m pip install --upgrade pip
          pip install bandit
          # Run Bandit and write JSON output
          bandit -r api/ config/ guardrails/ auth/ -f json -o bandit_report.json || true
          echo "Bandit summary:"
          # print human-readable summary
          python - <<'PY'
import json,sys
r=json.load(open('bandit_report.json'))
counts={'LOW':0,'MEDIUM':0,'HIGH':0}
for it in r.get('results',[]):
    sev = it.get('issue_severity','LOW').upper()
    if sev in counts:
        counts[sev]+=1
print("Low:",counts['LOW'])
print("Medium:",counts['MEDIUM'])
print("High:",counts['HIGH'])
# exit non-zero only if HIGH findings exist
if counts['HIGH']>0:
    print("\nHigh severity Bandit findings present — failing CI.")
    # optionally print each HIGH result summary
    for it in r.get('results',[]):
        if it.get('issue_severity','').upper()=='HIGH':
            print(f"FILE:{it.get('filename')} LINE:{it.get('line_number')} TEST:{it.get('test_id')} - {it.get('issue_text')}")
    sys.exit(1)
print("\nNo HIGH severity findings. CI will continue (MEDIUM/LOW reported).")
PY

  # ---------------------------------------------------------------------------
  # Stage 3: Automated Unit & Integration Testing
  # ---------------------------------------------------------------------------
  test:
    name: Unit & Integration Test Suite
    needs: [lint-and-validate, security-scan]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Pytest Suite with Coverage
        run: |
          python -m pytest tests/ -v

  # ---------------------------------------------------------------------------
  # Stage 4: Multi-Container Docker Build & Trivy Scan
  # ---------------------------------------------------------------------------
  build-containers:
    name: Build Multi-Stage Docker Images & Scan
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [backend, frontend, worker]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase Repository Name
        id: repo
        run: |
          echo "owner_repo=${GITHUB_REPOSITORY,,}" >> $GITHUB_OUTPUT

      - name: Determine Dockerfile Name
        id: dockerfile
        run: |
          if [ "${{ matrix.service }}" = "backend" ]; then
            echo "path=Dockerfile" >> $GITHUB_OUTPUT
          else
            echo "path=Dockerfile.${{ matrix.service }}" >> $GITHUB_OUTPUT
          fi

      - name: Build Docker Image Locally
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ steps.dockerfile.outputs.path }}
          load: true
          tags: local-${{ matrix.service }}:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: 'local-${{ matrix.service }}:test'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL'

      - name: Push Docker Image to GHCR
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging')
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ steps.dockerfile.outputs.path }}
          push: true
          tags: |
            ghcr.io/${{ steps.repo.outputs.owner_repo }}-${{ matrix.service }}:latest
            ghcr.io/${{ steps.repo.outputs.owner_repo }}-${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # Stage 5: Zero-Downtime Deployment & Automated Rollback
  # ---------------------------------------------------------------------------
  deploy-production:
    name: Deploy to Production Cluster (Kubernetes)
    needs: build-containers
    if: github.ref == 'refs/heads/main' && secrets.KUBE_CONFIG != ''
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Set up Kubernetes Context
        if: ${{ secrets.KUBE_CONFIG != '' }}
        uses: azure/k8s-set-context@v4
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBE_CONFIG }}

      - name: Lowercase Repository Name
        id: repo
        if: ${{ secrets.KUBE_CONFIG != '' }}
        run: |
          echo "owner_repo=${GITHUB_REPOSITORY,,}" >> $GITHUB_OUTPUT

      - name: Update Kubernetes Manifests with Tagged Images
        if: ${{ secrets.KUBE_CONFIG != '' }}
        run: |
          sed -i 's|ragtune/backend:latest|ghcr.io/${{ steps.repo.outputs.owner_repo }}-backend:${{ github.sha }}|g' k8s/deployment.yaml
          sed -i 's|ragtune/frontend:latest|ghcr.io/${{ steps.repo.outputs.owner_repo }}-frontend:${{ github.sha }}|g' k8s/frontend-deployment.yaml
          sed -i 's|ragtune/worker:latest|ghcr.io/${{ steps.repo.outputs.owner_repo }}-worker:${{ github.sha }}|g' k8s/worker-deployment.yaml

      - name: Apply Kubernetes Manifests with Rolling Update
        if: ${{ secrets.KUBE_CONFIG != '' }}
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/configmap.yaml
          kubectl apply -f k8s/secrets.yaml
          kubectl apply -f k8s/serviceaccounts-rbac.yaml
          kubectl apply -f k8s/network-policy.yaml
          kubectl apply -f k8s/
          
          # Rollout Verification with Auto-Rollback on failure
          kubectl rollout status deployment/backend -n ragtune-prod --timeout=300s || (kubectl rollout undo deployment/backend -n ragtune-prod && exit 1)
          kubectl rollout status deployment/frontend -n ragtune-prod --timeout=180s || (kubectl rollout undo deployment/frontend -n ragtune-prod && exit 1)
          kubectl rollout status deployment/worker -n ragtune-prod --timeout=180s || (kubectl rollout undo deployment/worker -n ragtune-prod && exit 1)

      - name: Post-Deployment Smoke Verification (Port-Forwarded)
        if: ${{ secrets.KUBE_CONFIG != '' }}
        run: |
          # Start background port-forwarding for the backend service
          kubectl port-forward svc/backend-service 8000:8000 -n ragtune-prod &
          PF_PID=$!
          
          # Wait a few seconds for the port-forward to establish
          sleep 5
          
          # Execute verification against the port-forwarded localhost endpoint
          python scripts/verify_deployment.py --url http://localhost:8000
          
          # Terminate background port-forward process
          kill $PF_PID

