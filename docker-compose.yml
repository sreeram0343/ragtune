version: '3.8'

services:
  # ---------------------------------------------------------------------------
  # 1. Frontend Web Service (Nginx Unprivileged)
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: ragtune-frontend
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - ragtune-public
      - ragtune-internal

  # ---------------------------------------------------------------------------
  # 2. FastAPI Engine & AI Orchestrator
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ragtune-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=RAGTUNE Enterprise AI Platform
      - DEBUG=true
      - HOST=0.0.0.0
      - PORT=8000
      - DATABASE_URL=postgresql://ragtune_user:ragtune_secure_pass_2026@postgres:5432/ragtune_db
      - REDIS_URL=redis://redis:6379/0
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - S3_ENDPOINT=http://minio:9000
      - S3_ACCESS_KEY=ragtune_minio_admin
      - S3_SECRET_KEY=ragtune_minio_secret_key_2026
      - S3_BUCKET_NAME=ragtune-enterprise-storage
      - ENFORCE_GUARDRAILS=true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - ragtune-internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ---------------------------------------------------------------------------
  # 3. Background AI Processing & Evaluation Worker
  # ---------------------------------------------------------------------------
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: ragtune-worker
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://ragtune_user:ragtune_secure_pass_2026@postgres:5432/ragtune_db
      - REDIS_URL=redis://redis:6379/0
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - ragtune-internal

  # ---------------------------------------------------------------------------
  # 4. PostgreSQL Relational Database
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: ragtune-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ragtune_user
      POSTGRES_PASSWORD: ragtune_secure_pass_2026
      POSTGRES_DB: ragtune_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ragtune-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ragtune_user -d ragtune_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # 5. Qdrant Vector Search Database
  # ---------------------------------------------------------------------------
  qdrant:
    image: qdrant/qdrant:v1.8.4
    container_name: ragtune-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - ragtune-internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ---------------------------------------------------------------------------
  # 6. Redis Multi-Layer Caching Engine
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7.2-alpine
    container_name: ragtune-redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel notice
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - ragtune-internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ---------------------------------------------------------------------------
  # 7. MinIO Object Storage (S3 Compatible)
  # ---------------------------------------------------------------------------
  minio:
    image: minio/minio:RELEASE.2024-03-15T20-11-47Z
    container_name: ragtune-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ragtune_minio_admin
      MINIO_ROOT_PASSWORD: ragtune_minio_secret_key_2026
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - ragtune-internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 3

  # MinIO Auto Bucket Creation Helper
  minio-init:
    image: minio/mc:RELEASE.2024-03-07T00-19-48Z
    container_name: ragtune-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio:9000 ragtune_minio_admin ragtune_minio_secret_key_2026;
      /usr/bin/mc mb --ignore-existing myminio/ragtune-enterprise-storage;
      /usr/bin/mc anonymous set download myminio/ragtune-enterprise-storage;
      exit 0;
      "
    networks:
      - ragtune-internal

  # ---------------------------------------------------------------------------
  # 8. Prometheus Metrics Scraper
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: ragtune-prometheus
    restart: unless-stopped
    volumes:
      - ./infrastructure/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infrastructure/monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - ragtune-internal

  # ---------------------------------------------------------------------------
  # 9. Grafana Observability Dashboard
  # ---------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:10.4.0
    container_name: ragtune-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=ragtune_grafana_pass_2026
      - GF_USERS_ALLOW_SIGN_UP=false
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - ragtune-internal

  # ---------------------------------------------------------------------------
  # 10. Loki Structured Log Aggregation Engine
  # ---------------------------------------------------------------------------
  loki:
    image: grafana/loki:2.9.4
    container_name: ragtune-loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - loki_data:/loki
    networks:
      - ragtune-internal

networks:
  ragtune-public:
    driver: bridge
  ragtune-internal:
    driver: bridge
    internal: false

volumes:
  postgres_data:
  qdrant_data:
  redis_data:
  minio_data:
  prometheus_data:
  grafana_data:
  loki_data:
