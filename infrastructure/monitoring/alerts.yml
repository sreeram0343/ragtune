groups:
  - name: RAGTUNE_Production_Alerts
    rules:
      - alert: HighAPIErrorRate
        expr: rate(http_requests_total{status=~"5.."}[5m]) / rate(http_requests_total[5m]) > 0.05
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "High API Error Rate Detected (>5%)"
          description: "API 5xx error rate exceeded 5% over the past 5 minutes."

      - alert: HighAPILatency
        expr: histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[5m])) by (le)) > 1.5
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "High 95th Percentile API Latency (>1.5s)"
          description: "API response latency p95 is higher than 1.5 seconds."

      - alert: LowCacheHitRate
        expr: (rate(redis_keyspace_hits_total[5m]) / (rate(redis_keyspace_hits_total[5m]) + rate(redis_keyspace_misses_total[5m]))) < 0.50
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Redis Cache Hit Rate Dropped (<50%)"
          description: "Multi-layer cache hit rate dropped below 50% threshold."

      - alert: HighDatabaseConnections
        expr: pg_stat_activity_count > 80
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL Connection Pool Near Exhaustion (>80)"
          description: "Active PostgreSQL connections exceed 80 pool capacity."

      - alert: VectorDBHighLatency
        expr: qdrant_search_duration_seconds > 0.500
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Qdrant Vector Search Latency Degraded (>500ms)"
          description: "Qdrant similarity search latency exceeded 500 milliseconds."
