apiVersion: v1
kind: Namespace
metadata:
  name: ragtune-prod
  labels:
    environment: production
    app.kubernetes.io/name: ragtune
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ragtune-pdb
  namespace: ragtune-prod
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: ragtune-api
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ragtune-api
  namespace: ragtune-prod
  labels:
    app: ragtune-api
    tier: api
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: ragtune-api
  template:
    metadata:
      labels:
        app: ragtune-api
        tier: api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - ragtune-api
              topologyKey: kubernetes.io/hostname
      containers:
      - name: ragtune-api
        image: ghcr.io/sreeram0343/ragtune:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
          name: http
        resources:
          requests:
            cpu: "500m"
            memory: "1Gi"
          limits:
            cpu: "2000m"
            memory: "4Gi"
        livenessProbe:
          httpGet:
            path: /api/v1/health
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/v1/health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
        env:
        - name: RAGTUNE_ENV
          value: "production"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: ragtune-secrets
              key: database-url
