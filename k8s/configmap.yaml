apiVersion: v1
kind: ConfigMap
metadata:
  name: ragtune-config
  namespace: ragtune-prod
  labels:
    app.kubernetes.io/name: ragtune
    app.kubernetes.io/component: config
data:
  APP_NAME: "RAGTUNE Enterprise Knowledge Intelligence Platform"
  VERSION: "1.0.0"
  DEBUG: "false"
  HOST: "0.0.0.0"
  PORT: "8000"
  DATABASE_URL: "postgresql://ragtune_user:$(POSTGRES_PASSWORD)@postgres-service:5432/ragtune_db"
  REDIS_URL: "redis://redis-service:6379/0"
  QDRANT_HOST: "qdrant-service"
  QDRANT_PORT: "6333"
  ENFORCE_GUARDRAILS: "true"
  GROUNDEDNESS_THRESHOLD: "0.65"
  CACHE_TTL_SECONDS: "3600"
  HITL_CONFIDENCE_THRESHOLD: "0.75"
