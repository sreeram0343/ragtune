apiVersion: v1
kind: ServiceAccount
metadata:
  name: ragtune-backend-sa
  namespace: ragtune-prod
  labels:
    app.kubernetes.io/name: ragtune
    app.kubernetes.io/component: backend
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ragtune-frontend-sa
  namespace: ragtune-prod
  labels:
    app.kubernetes.io/name: ragtune
    app.kubernetes.io/component: frontend
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ragtune-worker-sa
  namespace: ragtune-prod
  labels:
    app.kubernetes.io/name: ragtune
    app.kubernetes.io/component: worker
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ragtune-workload-role
  namespace: ragtune-prod
rules:
  - apiGroups: [""]
    resources: ["configmaps", "secrets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ragtune-backend-rolebinding
  namespace: ragtune-prod
subjects:
  - kind: ServiceAccount
    name: ragtune-backend-sa
    namespace: ragtune-prod
roleRef:
  kind: Role
  name: ragtune-workload-role
  apiGroup: rbac.authorization.k8s.io
