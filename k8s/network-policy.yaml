apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ragtune-network-policy
  namespace: ragtune-prod
spec:
  podSelector:
    matchLabels:
      app: ragtune-api
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: ingress-nginx
    ports:
    - protocol: TCP
      port: 8000
  egress:
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 5432
    - protocol: TCP
      port: 6379
    - protocol: TCP
      port: 443
