apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: ragtune-prod
  labels:
    app.kubernetes.io/name: ragtune
    app.kubernetes.io/component: postgres
spec:
  serviceName: postgres-service
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ragtune
        app.kubernetes.io/component: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_USER
              value: "ragtune_user"
            - name: POSTGRES_DB
              value: "ragtune_db"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ragtune-secrets
                  key: POSTGRES_PASSWORD
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "ragtune_user", "-d", "ragtune_db"]
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "ragtune_user", "-d", "ragtune_db"]
            initialDelaySeconds: 30
            periodSeconds: 15
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: postgres-storage
      spec:
        accessModes: [ "ReadWriteOnce" ]
        resources:
          requests:
            storage: 20Gi
